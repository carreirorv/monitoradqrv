<style>
html{-webkit-text-size-adjust:100%;}:root{--navy-950:#050325;--navy-900:#0a0750;--navy-800:#0f0d66;--navy-700:#161283;--orange:#FFA900;--paper:#f3f4fa;--ink:#0b0a2b;--ink-soft:#63628c;--good:#1fb178;--bad:#e5484d;--neutral:#8a89b3;--radius:9px;--mono-num:"Manrope",sans-serif;}
*{box-sizing:border-box;}html,body{margin:0;padding:0;height:100%;}body{background:var(--paper);color:var(--ink);font-family:"Work Sans",sans-serif;font-feature-settings:"tnum" 1,"lnum" 1;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:linear-gradient(135deg,#ffffff 0%,#f7f8fc 100%);color:var(--ink);padding:10px clamp(14px,3vw,36px);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;flex:none;border-bottom:1px solid #e7e8f1;box-shadow:0 2px 10px rgba(15,13,102,.05);}

.page-nav{flex:none;background:#f8f9fc;padding:4px clamp(14px,3vw,36px);display:flex;align-items:center;gap:4px;border-bottom:1px solid #e4e6ef;}.page-nav button{border:none;background:transparent;color:#70728d;font:700 12px "Manrope",sans-serif;padding:7px 14px;border-radius:6px;cursor:pointer;}.page-nav button:hover{color:var(--navy-800);background:#eef0f7;}.page-nav button.is-active{background:#f7c75b;color:#3c2a00;}.page-nav .nav-icon{display:inline-block;margin-right:5px;font-size:13px;vertical-align:-1px;}.page-nav .menu-nav-btn{margin-left:auto;background:#eef0f7;}.page-nav .menu-nav-btn:hover{background:#e5e7f1;}
.cover-home-btn{position:absolute;right:24px;top:72px;z-index:20;}.cover-menu{display:flex;flex:1 1 auto;min-height:0;align-items:center;justify-content:center;padding:clamp(18px,4vw,42px) clamp(14px,4vw,56px);overflow:auto;}

/* ===================== Tema moderno (estilo apps de banco) ===================== */
:root{--ui-bg:#eef1f5;--ui-surface:#ffffff;--ui-line:#e3e7ee;--ui-line-strong:#d3d9e3;--ui-navy:#16206b;--ui-navy-2:#1d2a85;--ui-text:#1b2140;--ui-muted:#6b7290;--ui-soft:#dde7ef;--ui-soft-2:#f4f6f9;--ui-teal:#2c7d91;--ui-radius:16px;--ui-shadow:0 1px 2px rgba(16,24,64,.04),0 8px 24px rgba(16,24,64,.06);}
body{background:var(--ui-bg);}
.topbar{background:var(--ui-surface);border-bottom:0;box-shadow:none;padding:14px clamp(16px,3vw,36px);}
.brand h1{font:800 19px "Manrope",sans-serif;color:var(--ui-text);letter-spacing:-.3px;}
.brand p{color:var(--ui-muted);}
.topbar-actions{gap:12px;}
.adq-switch{background:var(--ui-bg);padding:4px;gap:2px;border:1px solid var(--ui-line);}
.adq-btn{padding:8px 18px;font-size:12.5px;color:var(--ui-muted);border-radius:999px;transition:background .15s ease,color .15s ease,box-shadow .15s ease;}
.adq-btn:hover{color:var(--ui-text);}
.adq-btn.is-active{background:var(--ui-surface);color:var(--ui-text);box-shadow:0 1px 2px rgba(16,24,64,.08),0 4px 10px rgba(16,24,64,.08);}
.home-btn{height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--ui-line);background:var(--ui-surface);color:var(--ui-text);font:700 12.5px "Manrope",sans-serif;box-shadow:0 1px 2px rgba(16,24,64,.05);}
.home-btn:hover{background:var(--ui-soft-2);border-color:var(--ui-line-strong);}
.home-btn-icon{display:inline-flex;width:18px;height:18px;color:var(--ui-text);}
.home-btn-icon svg,.page-nav .nav-icon svg,.download-btn svg,.toggle-agrupamentos svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;}
.page-nav{background:var(--ui-bg);border-bottom:0;padding:12px clamp(16px,3vw,36px);gap:10px;flex-wrap:wrap;}
.page-nav button{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;background:var(--ui-surface);border:1px solid var(--ui-line);color:var(--ui-text);font:600 12.5px "Manrope",sans-serif;box-shadow:0 1px 2px rgba(16,24,64,.05);transition:background .15s ease,border-color .15s ease,transform .15s ease;}
.page-nav button:hover{background:var(--ui-surface);border-color:var(--ui-line-strong);color:var(--ui-text);transform:translateY(-1px);}
.page-nav button.is-active{background:var(--ui-soft);border-color:#c9d8e4;color:var(--ui-navy);box-shadow:none;transform:none;font-weight:700;}
.page-nav .nav-icon{display:inline-flex;width:17px;height:17px;margin:0;color:var(--ui-muted);}
.page-nav button.is-active .nav-icon{color:var(--ui-navy);}
.section-nav-bar{background:var(--ui-surface);border-top:1px solid var(--ui-line);border-bottom:1px solid var(--ui-line);padding:0 clamp(16px,3vw,36px);min-height:50px;}
.section-nav{gap:6px;}
.section-nav button{padding:15px 14px 13px;font:600 13px "Manrope",sans-serif;color:#4a5170;border-bottom:3px solid transparent;}
.section-nav button:hover{color:var(--ui-text);}
.section-nav button.is-active{color:var(--ui-text);border-bottom-color:var(--ui-teal);font-weight:800;}
.section-actions{gap:10px;}
.toggle-agrupamentos{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--ui-line);background:var(--ui-surface);color:var(--ui-text);font:600 12px "Manrope",sans-serif;gap:8px;transition:background .15s ease,border-color .15s ease;}
.toggle-agrupamentos svg{width:16px;height:16px;}
.toggle-agrupamentos input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none;}
.toggle-agrupamentos:has(input:checked){background:var(--ui-soft);border-color:#c9d8e4;color:var(--ui-navy);}
.toggle-agrupamentos:has(input:focus-visible){outline:2px solid var(--ui-teal);outline-offset:2px;}
.download-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--ui-line);background:var(--ui-surface);color:var(--ui-text);font:600 12px "Manrope",sans-serif;box-shadow:0 1px 2px rgba(16,24,64,.05);}
.download-btn svg{width:16px;height:16px;}
.download-btn:hover{background:var(--ui-soft-2);border-color:var(--ui-line-strong);}
main{padding-top:18px;}
/* Cartões e tabelas */
.table-wrap,.radar-side,.report-col,.report-summary{background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:var(--ui-radius);box-shadow:var(--ui-shadow);}
.overview-table thead tr:first-child th:first-child,.indicator-page .overview-main-table thead tr:first-child th:first-child{background:var(--ui-soft-2)!important;color:#3a4160!important;font:700 12px "Manrope",sans-serif;}
.overview-table thead tr:first-child th.group-header,.overview-table thead tr:first-child th.group-header[class*="group-"]{background:var(--ui-navy);color:#fff;font:800 12px "Manrope",sans-serif;border-left:1px solid rgba(255,255,255,.18);border-bottom:0;padding:10px 8px;}
.overview-table thead tr:nth-child(2) th{background:var(--ui-soft-2);color:#4f5674;border-bottom:1px solid var(--ui-line);border-left-color:var(--ui-line);font-weight:600;}
.overview-table thead th{border-bottom-color:var(--ui-line);}
.overview-table thead tr:nth-child(2) th.metric-start,.overview-table tbody td.metric-start{border-left:1px solid var(--ui-line-strong);}
.overview-table tbody td{border-bottom:1px solid #eef1f5;}
.overview-table thead tr:first-child th:first-child,.overview-table td:first-child{border-right:1px solid var(--ui-line-strong);}
.overview-table tbody tr.kind-total td,.indicator-page .overview-main-table tbody tr.kind-total td:first-child{background:var(--ui-soft)!important;color:var(--ui-text)!important;font-weight:800;}
.overview-table tbody tr.kind-grupo td,.indicator-page .overview-main-table tbody tr.kind-grupo td:first-child{background:var(--ui-soft-2)!important;color:var(--ui-text)!important;font-weight:700;}
.overview-table tbody tr.kind-filial:hover td{background:#f8fafc;}
tbody tr.kind-total td{background:var(--ui-soft);}
tbody tr.kind-grupo td{background:var(--ui-soft-2);}
tbody tr.kind-regs-total td{background:linear-gradient(90deg,#e8eff5 0%,#f4f6f9 100%);border-top:1px solid var(--ui-line-strong);border-bottom:1px solid var(--ui-line-strong);}
tbody tr.kind-regs-total td:first-child{border-left:3px solid var(--ui-teal);}
.ranking-table thead th,.ranking-table thead th:first-child{background:var(--ui-navy)!important;color:#fff!important;border-bottom:0;padding:9px 10px;font:700 11px "Manrope",sans-serif;}
.ranking-table tbody td{border-bottom:1px solid #eef1f5;padding:5px 10px;}
.ranking-table tbody tr.ranking-total td{background:var(--ui-soft);border-bottom:1px solid var(--ui-line-strong);}
.ranking-table tbody tr:hover td{background:#f8fafc;}
.ranking-table tbody tr.ranking-top td{background:var(--ui-surface);}
.pill{border-radius:6px;padding:1px 7px;font-weight:700;}
.pill.good{background:#dff5ea;color:#11804f;}
.pill.bad{background:#fde4e4;color:#c2353a;}
.pill.neutral{background:#eceef4;color:#646a86;}
/* Campos de filtro */
main select,main input[type="text"],main input[type="search"],.radar-filter select,.report-controls select,.faixas-filter select{height:36px;border:1px solid var(--ui-line);border-radius:10px;background-color:var(--ui-surface);padding:0 12px;font:600 12px "Manrope",sans-serif;color:var(--ui-text);box-shadow:0 1px 2px rgba(16,24,64,.04);}
main select:focus,main input:focus{outline:2px solid #b9d3df;outline-offset:1px;border-color:#9fc0cf;}
.faixas-legend{background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:var(--ui-radius);box-shadow:var(--ui-shadow);padding:12px 14px;}
.faixas-table th.faixa-relative-start,.faixas-table td.faixa-relative-start{border-left:2px solid var(--ui-line-strong);background:transparent;}
.hero{background:var(--ui-bg);border:0;box-shadow:none;padding:16px clamp(16px,3vw,36px) 4px;gap:12px;}
.hero-item{border:1px solid var(--ui-line);border-top:1px solid var(--ui-line);border-radius:var(--ui-radius);background:var(--ui-surface);box-shadow:var(--ui-shadow);padding:12px 14px;}
.hero-item:first-child{border-top:1px solid var(--ui-line);}
.hero-value{font-size:18px;color:var(--ui-text);}

/* Cabeçalhos das tabelas das demais visões no mesmo padrão (azul-marinho, sem filetes laranja) */
.productivity-table thead th,.radar-table thead th,.faixas-table thead th{background:var(--ui-navy)!important;color:#fff!important;border-bottom:0!important;box-shadow:none!important;font:700 10.5px "Manrope",sans-serif;padding-top:9px;padding-bottom:9px;}
.productivity-table th:nth-child(9),.productivity-table td:nth-child(9){border-left:1px solid var(--ui-line-strong);}
.productivity-table tbody tr.area-total td,.radar-table tbody tr.radar-supervisor td{background:var(--ui-soft)!important;color:var(--ui-text);border-top:1px solid var(--ui-line-strong);border-bottom:1px solid var(--ui-line-strong);}
.productivity-table tbody tr.area-total td:first-child,.radar-table tbody tr.radar-supervisor td:first-child{border-left:3px solid var(--ui-teal);}
.productivity-table tbody td,.radar-table tbody td{border-bottom:1px solid #eef1f5;}
.faixas-table tbody tr.faixas-total td,.faixas-table tbody tr.faixas-total:hover td{background:var(--ui-soft);color:var(--ui-text);border-bottom:1px solid var(--ui-line-strong);}
.faixas-table tbody tr.faixas-total td.faixa-percent{color:var(--ui-text);opacity:1;}
.faixas-table tbody tr.faixas-total td.faixa-relative-start{background:#cfe0ea;color:var(--ui-navy);}
.faixas-table th.faixa-relative-start{background:var(--ui-navy-2)!important;}
.faixas-table .faixa-rank{background:var(--ui-soft);color:var(--ui-navy);border-radius:6px;}
.radar-side h3{color:#fff!important;background:var(--ui-navy);border-bottom:0;padding:12px 14px;font:700 12.5px "Manrope",sans-serif;}
.radar-summary-table thead th,.faixas-legend-table thead th{border-bottom:1px solid var(--ui-line-strong);color:#4f5674;}
.radar-summary-table th,.radar-summary-table td,.faixas-legend-table th,.faixas-legend-table td{border-bottom-color:#eef1f5;}
.radar-summary-table tr.radar-summary-total td{background:var(--ui-soft);border-top:1px solid var(--ui-line-strong);}
main button:not(.download-btn):not(.report-flag):not(.page-btn):not(.section-btn){border-radius:10px;}

.home-btn{white-space:nowrap;}
@media(max-width:820px){.page-nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:10px 12px;gap:8px;}.page-nav::-webkit-scrollbar{display:none;}.page-nav button{flex:none;}.section-nav-bar{flex-wrap:wrap;padding:0 12px 10px;}.section-nav{flex:1 1 100%;}.section-actions{width:100%;justify-content:flex-end;}.topbar{padding:12px;flex-wrap:wrap;gap:10px;}.topbar-actions{width:100%;justify-content:space-between;}.adq-switch{min-width:0;}.home-btn{padding:0 12px;flex:none;}}

/* Topo compacto: mais espaço vertical para as tabelas */
.topbar{padding:8px clamp(16px,3vw,36px);}
.brand-mark{width:34px;height:34px;}
.brand h1{font-size:17px;}
.brand p{font-size:11px;}
.adq-switch{padding:3px;}
.adq-btn{padding:5px 15px;font-size:12px;}
.home-btn{height:32px;padding:0 13px;border-radius:10px;font-size:12px;}
.home-btn-icon{width:16px;height:16px;}
.page-nav{padding:7px clamp(16px,3vw,36px);gap:8px;}
.page-nav button{height:32px;padding:0 13px;border-radius:10px;font-size:12px;gap:7px;}
.page-nav .nav-icon{width:15px;height:15px;}
.section-nav-bar{min-height:40px;}
.section-nav button{padding:10px 12px 8px;font-size:12.5px;}
.toggle-agrupamentos,.download-btn{height:30px;padding:0 12px;border-radius:9px;font-size:11.5px;}
.toggle-agrupamentos svg,.download-btn svg{width:14px;height:14px;}
main{padding-top:12px;}
@media(max-width:820px){.page-nav{padding:7px 12px;}.section-nav-bar{padding:0 12px 8px;}.topbar{padding:8px 12px;}}
/* ===================== Tema HUB ADQ (claro, minimalista) ===================== */
:root{--ceu-claro:#EEF3F7;--ceu:#D6E2EB;--ceu-escuro:#B9CAD8;--grafite:#2E3642;--cinza:#768494;--linha:rgba(46,54,66,.14);--laranja:#E8A23A;
  --ui-bg:rgba(255,255,255,.38);--ui-surface:#ffffff;--ui-line:rgba(46,54,66,.11);--ui-line-strong:rgba(46,54,66,.2);--ui-navy:#2E3642;--ui-navy-2:#3b4452;--ui-text:#2E3642;--ui-muted:#768494;--ui-soft:#e2eaf1;--ui-soft-2:#f3f6f9;--ui-teal:#2E3642;--ui-radius:14px;--ui-shadow:0 1px 2px rgba(35,60,90,.04),0 18px 44px rgba(35,60,90,.09);--ink:#2E3642;--ink-soft:#768494;--navy-900:#2E3642;--navy-800:#2E3642;--navy-700:#3b4452;--orange:#E8A23A;--mono-num:"Manrope",system-ui,sans-serif;}
body{font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--grafite);background:radial-gradient(120% 90% at 80% 38%,var(--ceu-claro) 0%,var(--ceu) 48%,var(--ceu-escuro) 100%) fixed;}
/* Capa */
.hub-home{position:relative;flex:1 1 auto;min-height:100vh;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;padding:calc(28px + env(safe-area-inset-top,0px)) clamp(24px,6vw,96px) calc(24px + env(safe-area-inset-bottom,0px));}
.hub-floor{position:absolute;left:0;right:0;bottom:0;height:30vh;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.06) 30%,rgba(170,190,208,.25) 100%);border-top:1px solid rgba(255,255,255,.35);}
.hub-head,.hub-main,.hub-foot{position:relative;z-index:1;}
.hub-head{display:flex;align-items:center;gap:10px;}
.hub-head img{width:26px;height:26px;opacity:.92;}
.hub-head span{font-size:12px;letter-spacing:.2px;color:var(--cinza);}
.hub-main{display:grid;grid-template-columns:minmax(0,440px) 1fr;align-items:center;gap:clamp(24px,5vw,80px);}
.hub-title{font:300 clamp(34px,3.6vw,50px)/1.08 "Manrope",system-ui,sans-serif;letter-spacing:-.8px;margin:0 0 36px;color:var(--grafite);}
.hub-links{display:flex;flex-direction:column;border-top:1px solid var(--linha);}
.hub-links .hub-link{all:unset;box-sizing:border-box;display:grid;grid-template-columns:28px 1fr 16px;align-items:center;gap:14px;width:100%;padding:13px 4px;border-bottom:1px solid var(--linha);color:var(--grafite);cursor:pointer;transition:padding .2s ease,background .2s ease;}
.hub-links .hub-link:hover{padding-left:10px;background:rgba(255,255,255,.18);}
.hub-links .hub-link:focus-visible{outline:2px solid var(--grafite);outline-offset:2px;}
.hub-links .hub-link::before{display:none;}
.hub-links .cover-btn-icon{all:unset;width:28px;height:28px;display:grid;place-items:center;color:var(--cinza);}
.hub-links .cover-btn-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
.hub-links .cover-btn-text{display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;}
.hub-links .cover-btn-title{font:500 14px "Manrope",system-ui,sans-serif;color:var(--grafite);}
.hub-links .cover-btn-desc{font:400 12px "Manrope",system-ui,sans-serif;color:var(--cinza);}
.hub-links .hub-link::after{content:"";width:7px;height:7px;border-top:1.4px solid var(--cinza);border-right:1.4px solid var(--cinza);transform:rotate(45deg);justify-self:center;transition:border-color .2s ease;}
.hub-links .hub-link:hover::after{border-color:var(--grafite);}
.hub-links .cover-btn-icon,.hub-links .hub-link .cover-btn-icon{background:none!important;border:0!important;box-shadow:none!important;color:var(--cinza)!important;}
.hub-links .cover-btn-icon svg{stroke:currentColor!important;}
.hub-links .hub-link:hover .cover-btn-icon{color:var(--grafite)!important;}
.hub-vitrine{position:relative;display:flex;justify-content:flex-end;align-items:center;padding-right:clamp(0px,3vw,48px);height:min(76vh,700px);}
.hub-produto{position:relative;height:86%;}
.hub-produto img{display:block;height:100%;width:auto;object-fit:contain;filter:saturate(.55) brightness(1.04) contrast(.96) drop-shadow(-18px 26px 30px rgba(35,60,90,.22));}
.hub-produto .hub-reflexo{position:absolute;left:0;top:100%;margin-top:2px;transform:scaleY(-1);opacity:.14;filter:saturate(.4) blur(1.5px);-webkit-mask-image:linear-gradient(to top,#000 0%,transparent 22%);mask-image:linear-gradient(to top,#000 0%,transparent 22%);}
.hub-foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--cinza);}
.hub-foot a{color:var(--cinza);text-decoration:none;border-bottom:1px solid var(--linha);}
.hub-foot a:hover{color:var(--grafite);}
.hub-ponto{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--laranja);margin-right:7px;vertical-align:1px;}
@media(max-width:860px){.hub-main{grid-template-columns:1fr;align-content:center;padding:36px 0;}.hub-vitrine{display:none;}}
@media(prefers-reduced-motion:reduce){.hub-links .hub-link{transition:none;}}
/* Demais visões */
.topbar{background:transparent;}
.brand-mark{width:28px;height:28px;}
.brand h1{font:300 20px "Manrope",system-ui,sans-serif;letter-spacing:-.3px;color:var(--grafite);}
.brand p{color:var(--cinza);font-size:11px;}
.adq-switch{background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.7);}
.adq-btn{font-weight:500;color:var(--cinza);}
.adq-btn.is-active{background:#fff;color:var(--grafite);font-weight:600;box-shadow:0 6px 16px rgba(35,60,90,.10);}
.home-btn,.page-nav button,.toggle-agrupamentos,.download-btn,main button:not(.report-flag){border-radius:999px;font-weight:500;}
.home-btn,.page-nav button,.toggle-agrupamentos,.download-btn{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.85);color:var(--grafite);box-shadow:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.home-btn:hover,.page-nav button:hover,.toggle-agrupamentos:hover,.download-btn:hover{background:rgba(255,255,255,.9);border-color:#fff;transform:none;}
.page-nav{background:transparent;}
.page-nav .nav-icon{color:var(--cinza);}
.page-nav .nav-icon svg,.home-btn-icon svg,.download-btn svg,.toggle-agrupamentos svg{stroke-width:1.4;}
.page-nav button.is-active{background:var(--grafite);border-color:var(--grafite);color:#fff;font-weight:500;}
.page-nav button.is-active .nav-icon{color:#fff;}
.toggle-agrupamentos:has(input:checked){background:var(--grafite);border-color:var(--grafite);color:#fff;}
.section-nav-bar{background:rgba(255,255,255,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.6);border-bottom:1px solid var(--linha);}
.section-nav button{font:500 12.5px "Manrope",system-ui,sans-serif;color:var(--cinza);border-bottom-width:1.5px;}
.section-nav button:hover{color:var(--grafite);}
.section-nav button.is-active{color:var(--grafite);font-weight:600;border-bottom-color:var(--grafite);}
.table-wrap,.radar-side,.report-col,.report-summary,.faixas-legend,.hero-item{border:1px solid rgba(255,255,255,.85);box-shadow:var(--ui-shadow);}
table thead th,.overview-table thead tr:first-child th.group-header,.overview-table thead tr:first-child th.group-header[class*="group-"],.ranking-table thead th,.productivity-table thead th,.radar-table thead th,.faixas-table thead th{font-weight:500!important;letter-spacing:.2px;}
.overview-table thead tr:first-child th:first-child,.indicator-page .overview-main-table thead tr:first-child th:first-child{font-weight:500;color:var(--cinza)!important;}
.overview-table thead tr:nth-child(2) th{color:var(--cinza);font-weight:500;}
.overview-table tbody tr.kind-total td,.indicator-page .overview-main-table tbody tr.kind-total td:first-child,.ranking-table tbody tr.ranking-total td{font-weight:600;}
.overview-table tbody tr.kind-grupo td,.indicator-page .overview-main-table tbody tr.kind-grupo td:first-child{font-weight:600;}
tbody tr.kind-total td:not(:first-child),tbody tr.kind-grupo td:not(:first-child){font-weight:600;}
.ranking-table .rank-pos{font-weight:600;color:var(--grafite);}
.pill{font-weight:600;}
.pill.good{background:#dcefe6;color:#2f7a5b;}
.pill.bad{background:#f5e1de;color:#B5524A;}
.report-flag{font-weight:600;}
main h2,main h3{font-weight:500;}
main select,.radar-filter select,.report-controls select,.faixas-filter select{border-radius:999px;font-weight:500;background-color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);color:var(--grafite);}
.hero-value{font-weight:600;}

/* Destaques no tom do HUB */
:root{--good:#2f7a5b;--bad:#B5524A;--neutral:#768494;}
.hero{background:transparent;}
.hero-item{background:rgba(255,255,255,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.hero-icon,.hero-item .hero-icon{background:transparent!important;border:1px solid var(--linha)!important;color:var(--cinza)!important;border-radius:50%;}
.hero-label{color:var(--cinza);font-weight:500;}
.report-summary{background:rgba(255,255,255,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.report-op-name{font-weight:500;color:var(--grafite);}
.report-kpi strong{font-weight:600;color:var(--grafite);}
.report-col{background:rgba(255,255,255,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.report-col h3,.col-fortes h3,.col-melhoria h3{background:transparent!important;font:600 12.5px "Manrope",system-ui,sans-serif;border-bottom:1px solid var(--linha);padding:12px 14px;}
.col-fortes h3{color:var(--good)!important;}
.col-melhoria h3{color:var(--bad)!important;}
.insight{background:#fff;border-color:rgba(46,54,66,.08);border-left-width:3px;}
.insight-tag{background:var(--ui-soft);color:var(--cinza);font-weight:600;}
.insight-title{font-weight:600;color:var(--grafite);}
.report-flag{border-width:1px;background:rgba(255,255,255,.6);}

/* Separadores entre indicadores mais visíveis */
.overview-table thead tr:first-child th.group-header,.overview-table thead tr:first-child th.group-header[class*="group-"]{border-left:2px solid rgba(255,255,255,.55)!important;}
.overview-table thead tr:nth-child(2) th.metric-start,.overview-table tbody td.metric-start{border-left:2px solid rgba(46,54,66,.42)!important;}
.overview-table thead tr:first-child th:first-child,.overview-table td:first-child{border-right:2px solid rgba(46,54,66,.42)!important;}
td.escala-cor{color:var(--grafite);}
td.escala-cor small,td.escala-cor .venda-pct{color:rgba(46,54,66,.75);}

function numeroBR(txt){ const m=String(txt||'').replace(/\s/g,'').match(/-?[\d.]*,?\d+/); if(!m) return 0; const v=parseFloat(m[0].replace(/\./g,'').replace(',','.')); return isFinite(v)?v:0; }
function aplicarEscala(table, escala, modo){
  if(!table||!table.tHead) return;
  const ths=[...table.tHead.rows[table.tHead.rows.length-1].cells];
  const cols=escala.map(([rotulo,rgb])=>{ const i=ths.findIndex(th=>th.textContent.trim()===rotulo); return i<0?null:{i,rgb,th:ths[i]}; }).filter(Boolean);
  if(!cols.length) return;
  cols.forEach(c=>{ c.th.style.setProperty('box-shadow',`inset 0 -3px 0 rgb(${c.rgb})`,'important'); });
  [...table.tBodies].forEach(tb=>[...tb.rows].forEach(tr=>{
    if(tr.cells.length<=cols[cols.length-1].i) return;
    const vals=cols.map(c=>numeroBR(tr.cells[c.i].textContent));
    const soma=vals.reduce((a,b)=>a+b,0);
    cols.forEach((c,k)=>{
      const share=modo==='pct'?vals[k]/100:(soma>0?vals[k]/soma:0);
      const alpha=share>0?Math.min(.08+share*.55,.5):0;
      const td=tr.cells[c.i];
      td.style.setProperty('background-color',alpha?`rgba(${c.rgb},${alpha.toFixed(3)})`:'','important');
      td.style.setProperty('background-image','none','important');
      td.classList.add('escala-cor');
    });
  }));

function renderRadar(){
  const clean=(v)=>String(v??'').trim();

  // O Radar considera exclusivamente vendedores do tipo estrutural.
  const radarConsultores=CONSULTOR.filter(r=>clean(r['CONSULTOR_TIPO']).toLowerCase()==='estrutural');
  // O filtro de Áreas do Radar usa EXATAMENTE as áreas definidas na visão
  // Produtividade. Como as abas podem usar nomes diferentes para a mesma
  // área (ex.: BASE x BA/SE e NACs x NAC), normalizamos essas equivalências
  // apenas para localizar os consultores, mantendo no filtro o nome da
  // Produtividade.
  const normalizeArea=(v)=>clean(v).toUpperCase().replace(/\s+/g,' ');
  const radarAreaKey=(v)=>{
    const a=normalizeArea(v);
    if(a==='BA/SE' || a==='BASE') return 'BASE';
    if(a==='NAC' || a==='NACS') return 'NACS';
    return a;
  };
  const productivityAreas=[...new Set(PRODUTIVIDADE.map(r=>clean(r['Area'])).filter(Boolean))];
  const radarAreas=productivityAreas.map(a=>clean(a));
  const allAreas=radarAreas.filter(area=>radarConsultores.some(r=>radarAreaKey(r['AREA'])===radarAreaKey(area)));
  // Uma operação só pode participar do Radar se estiver efetivamente
  // vinculada a uma das áreas válidas da visão Produtividade. Operações
  // sem área correspondente (ex.: RV Point) ficam fora de todos os
  // filtros, agrupamentos e totais do Radar.
  const radarConsultoresComArea=radarConsultores.filter(r=>{
    const a=radarAreaKey(r['AREA']);
    return allAreas.some(area=>radarAreaKey(area)===a);
  });
  const allOps=[...new Set(radarConsultoresComArea.map(r=>clean(r['REG_AJUSTADA'])).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const oldArea=document.getElementById('radarAreaFilter')?.value||'';
  const oldOp=document.getElementById('radarOpFilter')?.value||'';
  const oldStatus=document.getElementById('radarStatusFilter')?.value||'';
  const allStatuses=[...new Set(radarConsultoresComArea.map(r=>clean(r['Status'])).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  let areaFilter=allAreas.includes(oldArea)?oldArea:'';
  let opFilter=allOps.includes(oldOp)?oldOp:'';
  let statusFilter=allStatuses.includes(oldStatus)?oldStatus:'';

  // Os filtros são dependentes: Área limita as Operações disponíveis e
  // Operação limita as Áreas disponíveis.
  if(areaFilter && opFilter){
    const comboExists=radarConsultoresComArea.some(r=>radarAreaKey(r['AREA'])===radarAreaKey(areaFilter)&&clean(r['REG_AJUSTADA'])===opFilter);
    if(!comboExists) opFilter='';
  }
  const availableOps=areaFilter
    ? [...new Set(radarConsultoresComArea.filter(r=>radarAreaKey(r['AREA'])===radarAreaKey(areaFilter)).map(r=>clean(r['REG_AJUSTADA'])).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'))
    : allOps;
  const availableAreas=opFilter
    ? [...new Set(radarConsultoresComArea.filter(r=>clean(r['REG_AJUSTADA'])===opFilter).map(r=>{ const a=radarAreas.find(pa=>radarAreaKey(pa)===radarAreaKey(r['AREA'])); return a||''; }).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'))
    : allAreas;
  if(areaFilter && !availableAreas.includes(areaFilter)) areaFilter='';
  if(opFilter && !availableOps.includes(opFilter)) opFilter='';

  const filtered=radarConsultoresComArea.filter(r=>{
    const area=radarAreaKey(r['AREA']); const op=clean(r['REG_AJUSTADA']);
    const status=clean(r['Status']);
    return (!areaFilter||area===radarAreaKey(areaFilter))&&(!opFilter||op===opFilter)&&(!statusFilter||status===statusFilter);
  });
  const groups={};
  filtered.forEach(r=>{
    const sup=clean(r['Login_super'])||'Sem supervisor';

    if(active(r['Status'])) g.activeCount++;
    g.rows.push(r);
  });
  // Identifica a operação de cada supervisor pela coluna REG_AJUSTADA dos seus consultores.
  // Se a base associar o mesmo supervisor a mais de uma operação, todas são exibidas.
  Object.values(groups).forEach(g=>{
    g.ops=[...new Set(g.rows.map(r=>clean(r['REG_AJUSTADA'])).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  });
  const supervisors=Object.values(groups).sort((a,b)=>b.m0-a.m0||b.activeCount-a.activeCount||a.sup.localeCompare(b.sup,'pt-BR'));
  const rows=[];
  supervisors.forEach(g=>{
    const operacoes=g.ops.join(" / ")||"Sem operação";
    rows.push(`<tr class="radar-supervisor"><td><strong>${clean(g.sup)}</strong><span class="radar-supervisor-op">${operacoes}</span></td><td>${fmtProdNumber(g.op)}</td><td>${fmtProdNumber(g.m0)}</td><td>${fmtProdNumber(g.m1)}</td><td>${fmtProdNumber(g.m2)}</td><td>${fmtProdNumber(g.m3)}</td></tr>`);
    g.rows.sort((a,b)=>Number(active(b['Status']))-Number(active(a['Status']))||n(b['ATIVO M0'])-n(a['ATIVO M0'])||clean(a['login']).localeCompare(clean(b['login']),'pt-BR')).forEach(r=>{
      const vals=[n(r['ATIVO M0']),n(r['ATIVO M1']),n(r['ATIVO M2']),n(r['ATIVO M3'])];
      const status=clean(r['Status']);
      const cell=(v)=>`<td class="${v>=4?'sales-high':''}">${fmtProdNumber(v)}</td>`;
      rows.push(`<tr class="radar-consultor ${active(status)?'radar-active':'radar-inactive'}"><td>${clean(r['login'])}<span class="radar-status"> · ${status}</span></td><td>${fmtProdNumber(r['OP M1'])}</td>${cell(vals[0])}${cell(vals[1])}${cell(vals[2])}${cell(vals[3])}</tr>`);
    });
  });

  // O resumo contabiliza exclusivamente consultores com Status Ativo.
  const countable=filtered.filter(r=>active(r['Status']));
  const total=countable.length;
  const bands=[
    ['Zero vendas',r=>active(r['Status'])&&n(r['ATIVO M0'])===0],

  const totalAtivacoesM0=countable.reduce((sum,r)=>sum+n(r['ATIVO M0']),0);
  const totalProdutividadeMedia=total?totalAtivacoesM0/total:0;
  const summaryTotal=`<tr class="radar-summary-total"><td>Total</td><td>${fmtProdNumber(total)}</td><td>100%</td><td>${fmtProdNumber(totalAtivacoesM0)}</td><td>${fmtProdNumber(totalProdutividadeMedia,1)}</td></tr>`;
  const header='<tr><th>Supervisor / Operação / Consultor</th><th>OP M-1</th><th>Ativações M0</th><th>Ativações M-1</th><th>Ativações M2</th><th>Ativações M3</th></tr>';
  document.body.classList.remove('radar-summary');
  document.getElementById('main').innerHTML=`<section class="section is-active"><div class="section-head"><h2>Radar de Produtividade</h2><div class="section-actions"><label class="toggle-agrupamentos"><input type="checkbox" id="toggleRadarResumo"><span>Visão Resumida</span></label><button class="download-btn" id="downloadRadar" type="button">Download</button></div></div><div class="radar-filter"><label>Área<select id="radarAreaFilter"><option value="">Todas</option>${availableAreas.map(a=>`<option value="${a.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${a}</option>`).join('')}</select></label><label>Operação<select id="radarOpFilter"><option value="">Todas</option>${availableOps.map(o=>`<option value="${o.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${o}</option>`).join('')}</select></label><label>Status<select id="radarStatusFilter"><option value="">Todos</option>${allStatuses.map(st=>`<option value="${st.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${st}</option>`).join('')}</select></label></div><div class="radar-layout"><div class="table-wrap"><table class="radar-table"><thead>${header}</thead><tbody>${rows.join('')}</tbody></table></div><aside class="radar-side"><h3>Qtd de consultores por faixa</h3><div class="radar-summary-note">* Contabiliza apenas consultores com status "Ativo".</div><table class="radar-summary-table"><thead><tr><th>Faixa</th><th>Qtd.</th><th>Part. %</th><th>Ativ. M0</th><th>Prod. média</th></tr></thead><tbody>${summaryRows}${summaryTotal}</tbody></table></aside></div></section>`;
  document.getElementById('radarAreaFilter').value=areaFilter;
  document.getElementById('radarOpFilter').value=opFilter;
  document.getElementById('radarStatusFilter').value=statusFilter;
  document.getElementById('radarAreaFilter').addEventListener('change',renderRadar);

  const totalMetric=Object.values(totalValues).reduce((a,b)=>a+b,0);
  const ranked=faixasItens.map(item=>{
    const values=headers.map(f=>Number(item.faixas[f]?.[metric]||0));
    const total=values.reduce((a,b)=>a+b,0);
    return {item,values,total,pctA:total?(values[0]/total)*100:0};
  }).sort((a,b)=>(b.pctA-a.pctA)||(b.total-a.total)||String(a.item.operacao).localeCompare(String(b.item.operacao),'pt-BR'));
  const rows=ranked.map(({item,values,total},pos)=>{
    const cells=values.map(v=>`<td>${fmtMetric(v)}</td>`).join('');
    const pctCells=values.map((v,i)=>`<td class="faixa-percent ${i===0?'faixa-relative-start faixa-sort-key':''}">${fmtPct(total?(v/total)*100:0)}</td>`).join('');
    return `<tr><td title="${item.operacao}"><span class="faixa-rank">${pos+1}º</span>${item.operacao}</td><td class="faixa-total-col">${fmtMetric(total)}</td>${cells}${pctCells}</tr>`;
  }).join('');
  const totalCells=headers.map(f=>`<td>${fmtMetric(totalValues[f])}</td>`).join('');
  const totalPctCells=headers.map((f,i)=>`<td class="faixa-percent ${i===0?'faixa-relative-start':''}">${fmtPct(totalMetric?(totalValues[f]/totalMetric)*100:0)}</td>`).join('');
  const totalRow=`<tr class="faixas-total"><td>${totalLabel}</td><td class="faixa-total-col">${fmtMetric(totalMetric)}</td>${totalCells}${totalPctCells}</tr>`;
  const options=Object.entries(metrics).map(([key,label])=>`<option value="${key}">${label}</option>`).join('');
  document.getElementById('main').innerHTML=`<section class="section is-active"><div class="section-head"><h2>Faixas de TPV</h2><div class="section-actions"><button class="download-btn" id="downloadFaixas" type="button">Download</button></div></div><div class="faixas-filter"><label>Área / Agrupamento<select id="faixasAreaFilter"><option value="">Todas</option><option value="REGs">REGs</option>${areas.map(a=>`<option value="${a.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${a}</option>`).join('')}</select></label><label>Indicador<select id="faixasMetric">${options}</select></label></div><div class="faixas-layout"><div class="table-wrap faixas-wrap"><table class="faixas-table"><thead><tr><th>Operação</th><th class="faixa-total-col">Total ${metrics[metric]}</th>${headers.map(f=>`<th>${f}</th>`).join('')}${headers.map((f,i)=>`<th class="${i===0?'faixa-relative-start':''}">%${f}</th>`).join('')}</tr></thead><tbody>${totalRow}${rows||'<tr><td colspan="14">Nenhuma operação encontrada.</td></tr>'}</tbody></table></div><aside class="faixas-legend" aria-label="Legenda das faixas de TPV"><div class="faixas-legend-title">Legenda das faixas</div><table class="faixas-legend-table"><thead><tr><th>Faixa</th><th>TPV a partir de</th><th>TPV abaixo de</th></tr></thead><tbody><tr><td>A</td><td>R$ 10K</td><td>—</td></tr><tr><td>B</td><td>R$ 5K</td><td>R$ 10K</td></tr><tr><td>C</td><td>R$ 2K</td><td>R$ 5K</td></tr><tr><td>D</td><td>R$ 0,5K</td><td>R$ 2K</td></tr><tr><td>E</td><td>R$ 0,1K</td><td>R$ 0,5K</td></tr><tr><td>F</td><td>—</td><td>R$ 0,1K</td></tr></tbody></table><div class="faixas-legend-foot">TPV do PDV no mês. R$ 0,1K = R$ 100,00.</div></aside></div><div class="faixas-note">Os valores de A a F mostram o indicador selecionado por faixa, e a coluna Total é a soma dessas faixas. Para ver a quantidade de PDVs por faixa, selecione o indicador PDVs. Os percentuais representam a participação de cada faixa no total do indicador da operação. As operações são ordenadas pelo maior %A do indicador selecionado, e o ranking é recalculado a cada troca de indicador.</div></section>`;
  document.getElementById('faixasMetric').value=metric;
  document.getElementById('faixasMetric').addEventListener('change',renderFaixas);
  document.getElementById('faixasAreaFilter').value=areaFilter;
  document.getElementById('faixasAreaFilter').addEventListener('change',renderFaixas);
  document.getElementById('downloadFaixas').addEventListener('click',downloadExcel);
}
let reportOp='';
const reportShow={fortes:true,melhoria:true};
function renderReporte(){
  const clean=(v)=>String(v??'').trim();
  const key=(v)=>clean(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ');
  // Equivalências de nomes de área entre as abas (ex.: BA/SE x BASE, NAC x NACS)
  const areaKey=(v)=>{ const a=key(v); if(a==='BA/SE'||a==='BASE') return 'BASE'; if(a==='NAC'||a==='NACS') return 'NACS'; return a; };
  const foraDeREGs=['NACS','CSC','RV POINT','OUTROS','NAO OPERACIONAL'];
  const n=(v)=>Number(v)||0;
  const pct=(v)=>dec.format(v)+'%';
  const pp=(v)=>(v>=0?'+':'')+dec.format(v)+' p.p.';
  const sinal=(v)=>(v>=0?'+':'')+dec.format(v)+'%';
  const esc=(v)=>clean(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  const secoes=DATA[currentAdq].secoes;

  // Opções do filtro: agrupamentos (Total RV, Total REGs, Total de cada área) + operações
  const ops=secoes.operantes.rows.filter(r=>r.kind==='filial' && key(r.nome)!=='CSC').map(r=>({nome:clean(r.nome),area:clean(r.area)}));
  const areasOrdem=[...new Set(ops.map(o=>o.area||'Sem área'))];
  const temRegs=secoes.operantes.rows.some(r=>r.kind!=='filial' && key(r.nome)==='TOTAL REGS');
  const escolhas=[{id:'grp:RV',tipo:'rv',label:'Total RV',area:'Todas as áreas'}];
  if(temRegs) escolhas.push({id:'grp:REGS',tipo:'regs',label:'Total REGs',area:'Áreas regionais'});
  areasOrdem.forEach(a=>{ if(a!=='Sem área') escolhas.push({id:'area:'+a,tipo:'area',label:'Total '+a,area:a}); });
  ops.forEach(o=>escolhas.push({id:'op:'+o.nome,tipo:'op',label:o.nome,area:o.area,nome:o.nome}));
  if(!escolhas.some(e=>e.id===reportOp)) reportOp='grp:RV'; // padrão: Total RV
  const sel=escolhas.find(e=>e.id===reportOp);
  const isGrupo=sel.tipo!=='op'; const isTotal=sel.tipo==='rv';
  const opt=(e)=>`<option value="${esc(e.id)}">${esc(e.label)}</option>`;
  // Agrupamentos no topo: Total RV, Total REGs e os totais de área nesta ordem;
  // áreas que não estiverem na lista entram depois, na ordem da base.
  const ordemAreas=['NACS','BASE','NORDESTE 8X','NORTE','SUL','SUDESTE'];
  const posArea=(a)=>{ const i=ordemAreas.indexOf(areaKey(a)); return i<0?ordemAreas.length+areasOrdem.indexOf(a):i; };
  const totaisArea=escolhas.filter(e=>e.tipo==='area').sort((x,y)=>posArea(x.area)-posArea(y.area));
  const options=`<optgroup label="Agrupamentos">${[...escolhas.filter(e=>e.tipo==='rv'||e.tipo==='regs'),...totaisArea].map(opt).join('')}</optgroup>`
    +[...areasOrdem].sort((x,y)=>posArea(x)-posArea(y)).map(a=>{ const lista=escolhas.filter(e=>e.tipo==='op'&&(e.area||'Sem área')===a); return lista.length?`<optgroup label="${esc(a)}">${lista.map(opt).join('')}</optgroup>`:''; }).join('');

  // Escopo da seleção
  const noEscopoArea=(area)=>{ const k=areaKey(area); if(sel.tipo==='rv') return true; if(sel.tipo==='regs') return k!=='' && !foraDeREGs.includes(k); if(sel.tipo==='area') return k===areaKey(sel.area); return false; };
  const linhaIndicador=(rows)=>{
    if(sel.tipo==='op') return rows.find(r=>r.kind==='filial' && key(r.nome)===key(sel.nome));
    if(sel.tipo==='rv') return rows.find(r=>r.kind==='total');
    if(sel.tipo==='regs') return rows.find(r=>r.kind!=='filial' && key(r.nome)==='TOTAL REGS');
    return rows.find(r=>r.kind!=='filial' && key(r.nome)===key('Total '+sel.area));
  };
  hero(linhaIndicador); // cards do topo acompanham o filtro

  const insights=[]; const semDados=[];
  const add=(tipo,origem,titulo,detalhe,destaque)=>insights.push({tipo,origem,titulo,detalhe,destaque});
  let naMeta=0, comMeta=0;
  const compara=isTotal?'':' no total geral';

  // 1) Painel de Indicadores + Ranking Indicadores
  Object.keys(SECTION_META).forEach(k=>{
    const spec=secoes[k]; if(!spec) return;
    const meta=SECTION_META[k]; const isChurn=meta.unidade==='pct'; const unit=meta.unidade;
    const row=linhaIndicador(spec.rows); if(!row) return;
    const v=row.valores;
    const hitMeta=isChurn ? v.m0<=v.meta : v.m0>=v.meta;
    let rankTxt='', pos=0, total=0;
    if(!isGrupo){
      // Ranking somente entre operações (agrupamentos não entram no ranking)
      const peers=spec.rows.filter(r=>r.kind==='filial' && key(r.nome)!=='CSC');
      const score=(r)=>{ const x=r.valores; if(isChurn) return x.meta>0 ? x.meta/(x.m0||Infinity) : 0; return ratio(x.m0,x.meta); };
      const ranked=[...peers].sort((a,b)=>score(b)-score(a)||clean(a.nome).localeCompare(clean(b.nome),'pt-BR'));
      pos=ranked.indexOf(row)+1; total=ranked.length; rankTxt=` · ${pos}º de ${total} no ranking`;
    }
    if(v.meta){
      comMeta++; if(hitMeta) naMeta++;
      const detalhe=`Real M0 ${fmt(v.m0,unit)} · Meta ${fmt(v.meta,unit)}${rankTxt}`;
      if(isChurn) add(hitMeta?'forte':'melhoria','Painel de Indicadores', hitMeta?`${meta.titulo} dentro da meta`:`${meta.titulo} acima da meta`, detalhe,[fmt(v.m0,unit),'meta '+fmt(v.meta,unit)]);
      else add(hitMeta?'forte':'melhoria','Painel de Indicadores', `${meta.titulo} ${hitMeta?'acima':'abaixo'} da meta`, detalhe,[pct(ratio(v.m0,v.meta)*100),'da meta']);
      if(!isGrupo && total>=6){
        if(pos<=3) add('forte','Ranking Indicadores',`Top 3 no ranking de ${meta.titulo}`,`${pos}º de ${total} operações em % da meta.`,[`${pos}º`,`de ${total}`]);
        else if(pos>total-3 && !hitMeta) add('melhoria','Ranking Indicadores',`Entre as 3 últimas no ranking de ${meta.titulo}`,`${pos}º de ${total} operações em % da meta.`,[`${pos}º`,`de ${total}`]);
      }
    }
    if(v.mant!==null && v.mant!==undefined){
      if(isChurn){
        const d=(v.m0-v.mant)*100;
        if(d<=-0.5) add('forte','Painel de Indicadores',`${meta.titulo} menor que no mês anterior`,`Data contra data: ${fmt(v.mant,unit)} → ${fmt(v.m0,unit)}.`,[pp(d),'vs mês ant.']);
        else if(d>=0.5) add('melhoria','Painel de Indicadores',`${meta.titulo} maior que no mês anterior`,`Data contra data: ${fmt(v.mant,unit)} → ${fmt(v.m0,unit)}.`,[pp(d),'vs mês ant.']);
      } else if(v.mant>0){
        const d=(v.m0/v.mant-1)*100;
        if(d>=5) add('forte','Painel de Indicadores',`${meta.titulo} em crescimento vs mês anterior`,`Data contra data: ${fmt(v.mant,unit)} → ${fmt(v.m0,unit)}.`,[sinal(d),'vs mês ant.']);
        else if(d<=-5) add('melhoria','Painel de Indicadores',`${meta.titulo} em queda vs mês anterior`,`Data contra data: ${fmt(v.mant,unit)} → ${fmt(v.m0,unit)}.`,[sinal(d),'vs mês ant.']);
      }
    }
  });

  // 2) Produtividade
  const agregaProd=(lista)=>{ const a={qMeta:0,qReal:0,pMetaW:0,pRealW:0,zero:0,mais2:0};
    lista.forEach(r=>{ const qm=n(r['QLP Orçado']), qr=n(r['QLP Real']); a.qMeta+=qm; a.qReal+=qr; a.pMetaW+=n(r['prod.meta'])*qm; a.pRealW+=n(r['prod.real'])*qr; a.zero+=n(r['Zero Vendas']); a.mais2+=n(r['3 Vendas'])+n(r['4 Vendas'])+n(r['>4 Vendas']); });
    a.pMeta=a.qMeta?a.pMetaW/a.qMeta:0; a.pReal=a.qReal?a.pRealW/a.qReal:0; return a; };
  const prodLista=isGrupo ? PRODUTIVIDADE.filter(r=>noEscopoArea(r['Area'])) : PRODUTIVIDADE.filter(r=>key(r['Operação'])===key(sel.nome));
  if(!prodLista.length) semDados.push('Produtividade');
  else {
    const P=isGrupo ? agregaProd(prodLista) : (()=>{ const r=prodLista[0]; const a=agregaProd([r]); a.pMeta=n(r['prod.meta']); a.pReal=n(r['prod.real']); return a; })();
    const G=agregaProd(PRODUTIVIDADE);
    if(P.pMeta>0){
      if(P.pReal>=P.pMeta) add('forte','Produtividade','Produtividade acima da meta',`prod.real ${fmtProdNumber(P.pReal,2)} vs prod.meta ${fmtProdNumber(P.pMeta,2)}.`,[fmtProdNumber(P.pReal,2),'meta '+fmtProdNumber(P.pMeta,2)]);
      else add('melhoria','Produtividade','Produtividade abaixo da meta',`prod.real ${fmtProdNumber(P.pReal,2)} vs prod.meta ${fmtProdNumber(P.pMeta,2)}.`,[fmtProdNumber(P.pReal,2),'meta '+fmtProdNumber(P.pMeta,2)]);
    }
    if(P.qMeta>0){
      const r=P.qReal/P.qMeta;
      if(r<0.95) add('melhoria','Produtividade','Quadro (QLP) abaixo do orçado',`${fmtProdNumber(P.qReal)} de ${fmtProdNumber(P.qMeta)} consultores (${fmtProdPct(r*100)}) · faltam ${fmtProdNumber(P.qMeta-P.qReal)}.`,[fmtProdPct(r*100),'do orçado']);
      else if(r>=1) add('forte','Produtividade','Quadro (QLP) completo',`${fmtProdNumber(P.qReal)} consultores para ${fmtProdNumber(P.qMeta)} orçados.`,[fmtProdPct(r*100),'do orçado']);
    }
    if(!isTotal && P.qReal>0 && G.qReal>0){
      const mais2=P.mais2/P.qReal*100, mais2G=G.mais2/G.qReal*100;
      if(mais2-mais2G>=3) add('forte','Produtividade','Mais consultores com mais de 2 vendas',`${pct(mais2)} da equipe vs ${pct(mais2G)}${compara}.`,[pp(mais2-mais2G),'vs geral']);
      else if(mais2-mais2G<=-3) add('melhoria','Produtividade','Poucos consultores com mais de 2 vendas',`${pct(mais2)} da equipe vs ${pct(mais2G)}${compara}.`,[pp(mais2-mais2G),'vs geral']);
      const zero=P.zero/P.qReal*100, zeroG=G.zero/G.qReal*100;
      if(zero-zeroG>=3) add('melhoria','Produtividade','Muitos consultores sem venda',`${pct(zero)} da equipe com zero vendas vs ${pct(zeroG)}${compara}.`,[pp(zero-zeroG),'vs geral']);
      else if(zero-zeroG<=-3) add('forte','Produtividade','Poucos consultores sem venda',`${pct(zero)} da equipe com zero vendas vs ${pct(zeroG)}${compara}.`,[pp(zero-zeroG),'vs geral']);
    }
  }

  // 3) Radar de Produtividade (consultores estruturais com status Ativo)
  const ativo=(r)=>clean(r['Status']).toLowerCase()==='ativo';
  const estrutural=CONSULTOR.filter(r=>clean(r['CONSULTOR_TIPO']).toLowerCase()==='estrutural' && ativo(r));
  const daSel=isGrupo ? estrutural.filter(r=>noEscopoArea(r['AREA'])) : estrutural.filter(r=>key(r['REG_AJUSTADA'])===key(sel.nome));
  if(!daSel.length) semDados.push('Radar de Produtividade');
  else {
    const share=(lista,test)=>lista.length?lista.filter(test).length/lista.length*100:0;
    const alto=(r)=>n(r['ATIVO M0'])>3;
    if(!isTotal){
      const altoSel=share(daSel,alto), altoG=share(estrutural,alto);
      if(altoSel-altoG>=3) add('forte','Radar de Produtividade','Destaque em consultores com mais de 3 vendas',`${pct(altoSel)} dos consultores ativos vs ${pct(altoG)} no geral.`,[pp(altoSel-altoG),'vs geral']);
      else if(altoSel-altoG<=-3) add('melhoria','Radar de Produtividade','Poucos consultores com mais de 3 vendas',`${pct(altoSel)} dos consultores ativos vs ${pct(altoG)} no geral.`,[pp(altoSel-altoG),'vs geral']);
    }
    const sups={};
    daSel.forEach(r=>{ const s=clean(r['Login_super'])||'Sem supervisor'; if(!sups[s]) sups[s]={sup:s,qtd:0,zero:0,m0:0,ops:new Set()}; sups[s].qtd++; sups[s].m0+=n(r['ATIVO M0']); if(n(r['ATIVO M0'])===0) sups[s].zero++; if(clean(r['REG_AJUSTADA'])) sups[s].ops.add(clean(r['REG_AJUSTADA'])); });
    const lista=Object.values(sups).filter(s=>s.qtd>=3);
    const opsTxt=(s)=>isGrupo&&s.ops.size?` (${[...s.ops].join(' / ')})`:'';
    if(lista.length>=2){
      const melhor=[...lista].sort((a,b)=>b.m0/b.qtd-a.m0/a.qtd)[0];
      add('forte','Radar de Produtividade',`Supervisor destaque: ${melhor.sup}${opsTxt(melhor)}`,`Média de ${fmtProdNumber(melhor.m0/melhor.qtd,1)} ativações em M0 por consultor ativo (${fmtProdNumber(melhor.qtd)} consultores).`,[fmtProdNumber(melhor.m0/melhor.qtd,1),'ativ./consultor']);
    }
    const critico=[...lista].sort((a,b)=>b.zero/b.qtd-a.zero/a.qtd)[0];
    if(critico && critico.zero/critico.qtd>=0.5) add('melhoria','Radar de Produtividade',`Equipe do supervisor ${critico.sup}${opsTxt(critico)} com muitos consultores sem venda`,`${fmtProdNumber(critico.zero)} de ${fmtProdNumber(critico.qtd)} consultores ativos sem ativação em M0.`,[`${fmtProdNumber(critico.zero)} de ${fmtProdNumber(critico.qtd)}`,'sem venda']);
  }

  // 4) Faixas de TPV
  const somaFaixas=(lista)=>{ const it={faixas:{}}; 'ABCDEF'.split('').forEach(f=>{ it.faixas[f]={}; ['pdvs','tpv'].forEach(m=>{ it.faixas[f][m]=lista.reduce((s,x)=>s+n(x.faixas[f]?.[m]),0); }); }); return it; };
  const faixasLista=isGrupo ? FAIXAS_TPV.filter(it=>noEscopoArea(it.area)) : FAIXAS_TPV.filter(it=>key(it.operacao)===key(sel.nome));
  if(!faixasLista.length) semDados.push('Faixas de TPV');
  else if(!isTotal){
    const item=somaFaixas(faixasLista), geral=somaFaixas(FAIXAS_TPV);
    const part=(it,f,m)=>{ const tot='ABCDEF'.split('').reduce((s,x)=>s+n(it.faixas[x]?.[m]),0); return tot?n(it.faixas[f]?.[m])/tot*100:0; };
    const aOp=part(item,'A','pdvs'), aG=part(geral,'A','pdvs');
    if(aOp-aG>=2) add('forte','Faixas de TPV','Mais PDVs na faixa A (TPV ≥ R$ 10K)',`${pct(aOp)} dos PDVs vs ${pct(aG)} no total geral.`,[pp(aOp-aG),'vs geral']);
    else if(aOp-aG<=-2) add('melhoria','Faixas de TPV','Poucos PDVs na faixa A (TPV ≥ R$ 10K)',`${pct(aOp)} dos PDVs vs ${pct(aG)} no total geral.`,[pp(aOp-aG),'vs geral']);
    const fOp=part(item,'F','pdvs'), fG=part(geral,'F','pdvs');
    if(fOp-fG>=2) add('melhoria','Faixas de TPV','Concentração de PDVs na faixa F (TPV < R$ 100)',`${pct(fOp)} dos PDVs vs ${pct(fG)} no total geral.`,[pp(fOp-fG),'vs geral']);
    else if(fOp-fG<=-2) add('forte','Faixas de TPV','Poucos PDVs na faixa F (TPV < R$ 100)',`${pct(fOp)} dos PDVs vs ${pct(fG)} no total geral.`,[pp(fOp-fG),'vs geral']);
    const tOp=part(item,'A','tpv'), tG=part(geral,'A','tpv');
    if(tOp-tG>=2) add('forte','Faixas de TPV','TPV concentrado em PDVs de alto valor',`Faixa A responde por ${pct(tOp)} do TPV vs ${pct(tG)} no total geral.`,[pp(tOp-tG),'vs geral']);
    else if(tOp-tG<=-2) add('melhoria','Faixas de TPV','Baixa participação da faixa A no TPV',`Faixa A responde por ${pct(tOp)} do TPV vs ${pct(tG)} no total geral.`,[pp(tOp-tG),'vs geral']);
  }

  const card=(i)=>`<li class="insight insight-${i.tipo}"><div class="insight-body"><span class="insight-tag">${esc(i.origem)}</span><div class="insight-title">${esc(i.titulo)}</div><div class="insight-detail">${esc(i.detalhe)}</div></div>${i.destaque?`<div class="insight-kpi"><span class="insight-kpi-value">${esc(i.destaque[0])}</span><span class="insight-kpi-label">${esc(i.destaque[1])}</span></div>`:''}</li>`;
  const fortes=insights.filter(i=>i.tipo==='forte'), melhoria=insights.filter(i=>i.tipo==='melhoria');
  const lista=(arr,vazio)=>arr.length?arr.map(card).join(''):`<li class="insight-empty">${vazio}</li>`;
  const flag=(id,cls,icone,label,qtd)=>`<button type="button" class="report-flag ${cls}" data-flag="${id}" aria-pressed="${reportShow[id]}">${icone} ${label} <span class="flag-count">${qtd}</span></button>`;
  const semDadosTxt=semDados.length?`<div class="report-missing">Sem dados desta seleção em: ${semDados.join(', ')}.</div>`:'';
  const subtitulo=sel.tipo==='op' ? `${esc(sel.area||'Sem área')} · Operação` : (sel.tipo==='area' ? `Agrupamento da área ${esc(sel.area)}` : esc(sel.area));
  const notaGrupo=isGrupo?' Para agrupamentos não há posição no ranking (ele compara operações)'+(isTotal?', e no Total RV as comparações com o total geral não se aplicam.':'.'):'';
  document.body.classList.remove('summary-only');
  document.getElementById('main').innerHTML=`<section class="section is-active report-page"><div class="section-head"><h2>Destaques</h2><div class="report-controls"><label>Operação / Agrupamento<select id="reportOpFilter">${options}</select></label></div></div>
<div class="report-summary"><div class="report-op"><span class="report-op-name">${esc(sel.label)}</span><span class="report-op-area">${subtitulo} · Adquirente ${esc(currentAdq)}</span></div><div class="report-kpi"><span>Indicadores na meta</span><strong>${naMeta} de ${comMeta}</strong></div><div class="report-flags" role="group" aria-label="Mostrar ou ocultar insights">${flag('fortes','flag-fortes','▲','Pontos fortes',fortes.length)}${flag('melhoria','flag-melhoria','▼','Pontos de melhoria',melhoria.length)}</div></div>
<div class="report-grid ${reportShow.fortes?'':'hide-fortes'} ${reportShow.melhoria?'':'hide-melhoria'}" id="reportGrid"><div class="report-col col-fortes"><h3>▲ Pontos fortes</h3><ul>${lista(fortes,'Nenhum ponto forte identificado pelos critérios.')}</ul></div><div class="report-col col-melhoria"><h3>▼ Pontos de melhoria</h3><ul>${lista(melhoria,'Nenhum ponto de melhoria identificado pelos critérios.')}</ul></div><div class="report-empty-flags">Ative “Pontos fortes” ou “Pontos de melhoria” para ver os insights.</div></div>
${semDadosTxt}<div class="report-note"><strong>Critérios:</strong> metas e ranking (% da meta entre as operações; top 3 e 3 últimas, estas só quando a meta não foi atingida) do Painel de Indicadores; variação vs mês anterior de ±5% (churn ±0,5 p.p.), data contra data; Produtividade, Radar (consultores estruturais ativos) e Faixas de TPV comparados ao total geral, com diferença mínima de 3 p.p. (faixas: 2 p.p.).${notaGrupo}</div></section>`;
  document.getElementById('reportOpFilter').value=reportOp;
  document.getElementById('reportOpFilter').addEventListener('change',(e)=>{ reportOp=e.target.value; renderReporte(); });
  document.querySelectorAll('.report-flag').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.flag; reportShow[id]=!reportShow[id];
    b.setAttribute('aria-pressed',String(reportShow[id]));
    document.getElementById('reportGrid').classList.toggle('hide-'+id,!reportShow[id]);
  }));
}
function refresh(){
const isProdutividade=currentPage==='produtividade';
const isRadar=currentPage==='radar';
const isFaixas=currentPage==='faixas';
const isReporte=currentPage==='reporte';
document.body.classList.toggle('indicator-page', currentPage==='indicadores');
const isRanking=currentPage==='ranking';
const isHome=currentPage==='home';
document.getElementById('coverMenu').style.display=isHome?'grid':'none';
const topbarEl=document.querySelector('.topbar'); if(topbarEl) topbarEl.style.display=isHome?'none':'';
const homeButtonEl=document.getElementById('homeButton'); if(homeButtonEl) homeButtonEl.style.display=isHome?'none':'flex';
document.getElementById('hero').style.display=isReporte?'flex':'none';
const sectionBar=document.querySelector('.section-nav-bar'); if(sectionBar) sectionBar.style.display=(isProdutividade||isRadar||isFaixas||isReporte||isHome)?'none':'flex';
const adqSwitch=document.getElementById('adqSwitch'); if(adqSwitch) adqSwitch.style.display=(isHome||isProdutividade||isRadar||isFaixas)?'none':'flex';
const pageNav=document.getElementById('pageNav'); if(pageNav) pageNav.style.display=isHome?'none':'flex';
const mainEl=document.getElementById('main'); if(mainEl) mainEl.style.display=isHome?'none':'';
if(isHome){ if(mainEl) mainEl.innerHTML=''; }
const resumoToggle=document.getElementById('toggleAgrupamentos')?.parentElement; const isOverview=currentSection==='overview'; if(resumoToggle) resumoToggle.style.display=isRanking?'none':'flex'; const overviewSectionButton=document.querySelector('.section-btn[data-section="overview"]'); if(overviewSectionButton) overviewSectionButton.style.display=isRanking?'none':'';
if(isProdutividade){ renderProdutividade(); } else if(isRadar){ renderRadar(); } else if(isFaixas){ renderFaixas(); } else if(isReporte){ renderReporte(); } else if(isRanking){ renderRanking(); } else if(!isHome){ if(isOverview) renderOverview(); else renderSection(); }
const indicatorHero=document.getElementById('hero'); document.documentElement.style.setProperty('--indicator-sticky-top',(currentPage==='indicadores'&&indicatorHero?indicatorHero.offsetHeight:0)+'px');
document.querySelectorAll('.adq-btn').forEach(b=>{ const active=b.dataset.adq===currentAdq;b.classList.toggle('is-active',active);b.setAttribute('aria-selected',active); });
document.querySelectorAll('.section-btn').forEach(b=>b.classList.toggle('is-active',b.dataset.section===currentSection || (isRanking && isOverview && b.dataset.section==='operantes')));
document.querySelectorAll('.page-btn').forEach(b=>b.classList.toggle('is-active',b.dataset.page===currentPage));
}
const homeButton=document.getElementById('homeButton'); if(homeButton) homeButton.addEventListener('click',()=>{currentPage='home';refresh();});
document.querySelectorAll('.cover-btn').forEach(b=>b.addEventListener('click',()=>{currentPage=b.dataset.page;refresh();}));
document.querySelectorAll('.page-btn').forEach(b=>b.addEventListener('click',()=>{currentPage=b.dataset.page;refresh();}));
document.querySelectorAll('.adq-btn').forEach(b=>b.addEventListener('click',()=>{currentAdq=b.dataset.adq;refresh();}));
document.querySelectorAll('.section-btn').forEach(b=>b.addEventListener('click',()=>{currentSection=b.dataset.section;refresh();}));
function downloadExcel(){ const table=document.querySelector('#main table'); if(!table) return; const htmlTable='<html><head><meta charset="UTF-8"></head><body>'+table.outerHTML+'</body></html>'; const blob=new Blob(['﻿',htmlTable],{type:'application/vnd.ms-excel;charset=utf-8'}); const url=URL.createObjectURL(blob); const link=document.createElement('a'); link.href=url; link.download='Painel_360_ADQ_'+currentAdq+'_'+currentSection+'.xls'; document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url); }
document.getElementById('toggleAgrupamentos').addEventListener('change',()=>{ if(currentSection==='overview') renderOverview(); else renderSection(); }); document.getElementById('downloadExcel').addEventListener('click',downloadExcel); refresh();
</script></body></html>
